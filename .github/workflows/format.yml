name: Formatting

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clang-format:
    name: clang-format
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      # clang-format-18 is already included in the Ubuntu 24.04 runner image.
      - name: Check formatting
        run: |
          clang-format-18 --version
          make format-check
